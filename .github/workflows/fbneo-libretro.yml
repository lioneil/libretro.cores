name: FBNeo libretro Linux aarch64

on:
  schedule:
    - cron: '0 2 * * *'
  watch:
    types: [started]
    if: github.actor == github.event.repository.owner.login
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
      tags:
        description: 'Manually triggered run'
        required: false
        type: boolean
      environment:
        description: 'Environment to run manually against'
        type: environment
        required: false

jobs:
  Linux:
    name: Build for Linux
    runs-on: ubuntu-20.04

    steps:
    - name: add foreign arch
      run: |
        sudo dpkg --add-architecture arm64
        sudo rm -rf /etc/apt/sources.list
        echo "deb [arch=amd64] http://archive.ubuntu.com/ubuntu focal main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
        echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
        sudo apt update

    - name: Install needed packages
      run: sudo apt install -y wget:amd64 git:amd64 build-essential gcc:amd64 make:amd64 g++-aarch64-linux-gnu:amd64 gcc-aarch64-linux-gnu:amd64 binutils-aarch64-linux-gnu:amd64

    - name: Checkout source
      run: git clone https://github.com/libretro/FBNeo.git && cd FBNeo && git submodule update --init

    - name: Build libretro core
      working-directory: FBNeo/src/burner/libretro
      run: |
        make -j8 CC=/usr/bin/aarch64-linux-gnu-gcc CXX=/usr/bin/aarch64-linux-gnu-g++
        wget https://raw.githubusercontent.com/libretro/libretro-super/master/retrolink.sh && chmod +x retrolink.sh && ./retrolink.sh fbneo_libretro.so
        zip -9 ../../../../fbneo_libretro.so.zip fbneo_libretro.so

    - name: Create new release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: Linux_aarch64
        file: fbneo_libretro.so.zip
        overwrite: true
